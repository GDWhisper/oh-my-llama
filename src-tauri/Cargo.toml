[package]
name = "oh-my-llama"
# 应用版本号的唯一真源是 src-tauri/tauri.conf.json 的 "version"——它同时驱动
# 运行时 getVersion()、安装包版本与 CI Release 名（__VERSION__）。此处刻意省略
# version：Cargo 会默认取 0.0.0（Cargo.lock 中同为 0.0.0，属预期，勿手工回填），
# 该值不参与分发，避免多处版本号各自漂移。发版只需改 tauri.conf.json 一处。
description = "Oh My Llama"
authors = ["GDWhisper"]
edition = "2021"

[lib]
name = "oh_my_llama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 内置自动更新（方案 A）：check/download/install 由前端经 JS API 调用，
# Rust 侧仅需注册 Builder；签名公钥在 tauri.conf.json 的 plugins.updater.pubkey，
# 私钥仅存本地（~/.tauri/oh-my-llama.key），绝不入库，发布时由 CI 环境变量注入。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = "0.30"
# 系统性能监控：NVIDIA GPU 利用率/显存/温度（动态加载 nvml.dll，无 N 卡时优雅降级）。
# 借鉴 nano-stat 的硬件模块（MIT）。
nvml-wrapper = "0.10"
toml = { version = "1.1.2", features = ["serde"] }
# 仅用于 Job Object 内核级守护（KILL_ON_JOB_CLOSE）与控制台 CTRL_C_EVENT 优雅退出信号。
# 微软官方 crate，仅链接期绑定、体积极小，结构体布局经过审计。
# feature 门控（已按 0.59 源码核对）：
#   - CreateJobObjectW          → Win32_Security
#   - JOBOBJECT_EXTENDED_LIMIT_INFORMATION → Win32_System_Threading
# 0.59 已锁定且本地缓存，离线可编译。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }
