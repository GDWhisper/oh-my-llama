name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 现状：Windows（主平台，NSIS 安装包 + updater）。
          - platform: 'windows-latest'
            args: ''
          # Linux：deb/rpm/AppImage；无签名门槛，直接发布。
          - platform: 'ubuntu-22.04'
            args: ''
          # macOS：GitHub macos-latest runner 原生为 arm64（本项目忽略 x86_64 mac）。
          # 当前发未签名版（用户右键打开绕过 Gatekeeper），macOS updater 待 Apple 证书就绪后启用；
          # 不传 args target，由 tauri-action 按 runner 架构产出 aarch64 包。
          - platform: 'macos-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 在 Linux 构建的系统依赖（官方文档 Ubuntu 清单；仅 Linux runner 需要）
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（内容）。公钥已写进 src-tauri/tauri.conf.json 的
          # plugins.updater.pubkey。私钥仅存于此仓库 Secrets，绝不入库。
          # 缺失该变量时构建仍成功，但产物无 .sig、不会生成 latest.json，更新不可用。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Oh My Llama v__VERSION__'
          releaseBody: 'See the assets to download and install.'
          # 先生成草稿，检查产物无误后在 GitHub Releases 页面点 Publish 即可发布。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # 更新通道：.sig 签名文件由 tauri 构建（bundle.createUpdaterArtifacts=true）产出，
          # includeUpdaterJson 让 tauri-action 生成 latest.json 并自动上传为 Release 资产，
          # 与 tauri.conf.json 的 plugins.updater.endpoints 对应。
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
